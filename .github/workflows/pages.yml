name: pages
on:
  push:
    branches: [main]
    paths: ["docs/**", "tools/site/**", "tools/example.sh", "examples/**", "cmd/**", "internal/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tools/site/package-lock.json
      - name: Build site
        working-directory: tools/site
        run: |
          npm ci
          SITE_OUT="$GITHUB_WORKSPACE/_site" node build.mjs
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false
      - name: Publish the So Sovereign Cloud example
        run: tools/example.sh _site/example
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
