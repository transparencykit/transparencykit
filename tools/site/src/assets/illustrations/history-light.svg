<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="history-light-title history-light-desc"><title id="history-light-title">A correction adds a page to history.</title><desc id="history-light-desc">Three signed publications retain previous hashes so a retained later manifest can reveal changes to earlier bytes; trusted copies are still needed to detect rollback.</desc><defs><marker id="history-light-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#4b6266"/></marker><marker id="history-light-arrow-accent" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#1e6b57"/></marker><marker id="history-light-arrow-link" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#4b6266"/></marker></defs><rect x="0" y="0" width="1280" height="720" rx="0" fill="#f5f7f6" stroke="none" /><text x="48" y="48" font-size="12" font-family="Menlo, 'Courier New', monospace" font-weight="400" fill="#4b6266" letter-spacing="1.5">02 / THE PUBLICATION CHAIN</text><text x="48" y="104" font-size="40" font-family="Georgia, 'Times New Roman', serif" font-weight="400" fill="#0f2a2e" >A correction adds a page to history.</text><text x="48" y="140" font-size="16" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#4b6266" >Each new publication records the hash of the one before it. Earlier versions remain available.</text><path d="M472 340H384" fill="none" stroke="#4b6266" stroke-width="1.8" marker-end="url(#history-light-arrow)" stroke-linecap="butt"/><path d="M872 340H784" fill="none" stroke="#4b6266" stroke-width="1.8" marker-end="url(#history-light-arrow)" stroke-linecap="butt"/><rect x="72" y="236" width="312" height="224" rx="6" fill="#ffffff" stroke="#4b6266" stroke-width="1"/><text x="96" y="272" font-size="16" font-family="Arial, Helvetica, sans-serif" font-weight="600" fill="#0f2a2e" >First publication</text><text x="96" y="316" font-size="28" font-family="Georgia, 'Times New Roman', serif" font-weight="400" fill="#0f2a2e" >2026 / v1</text><path d="M96 340H360" fill="none" stroke="#c9d8d4" stroke-width="1" stroke-linecap="butt"/><text x="96" y="372" font-size="12" font-family="Menlo, 'Courier New', monospace" font-weight="400" fill="#4b6266" >this hash</text><text x="272" y="372" font-size="12" font-family="Menlo, 'Courier New', monospace" font-weight="400" fill="#0f2a2e" >9a07…</text><text x="96" y="408" font-size="12" font-family="Menlo, 'Courier New', monospace" font-weight="400" fill="#4b6266" >previous</text><text x="272" y="408" font-size="12" font-family="Menlo, 'Courier New', monospace" font-weight="400" fill="#0f2a2e" >none</text><text x="96" y="436" font-size="12" font-family="Menlo, 'Courier New', monospace" font-weight="400" fill="#4b6266" >Files + manifest + signature</text><rect x="472" y="236" width="312" height="224" rx="6" fill="#ffffff" stroke="#4b6266" stroke-width="1"/><text x="496" y="272" font-size="16" font-family="Arial, Helvetica, sans-serif" font-weight="600" fill="#0f2a2e" >Correction</text><text x="496" y="316" font-size="28" font-family="Georgia, 'Times New Roman', serif" font-weight="400" fill="#0f2a2e" >2026 / v2</text><path d="M496 340H760" fill="none" stroke="#c9d8d4" stroke-width="1" stroke-linecap="butt"/><text x="496" y="372" font-size="12" font-family="Menlo, 'Courier New', monospace" font-weight="400" fill="#4b6266" >this hash</text><text x="672" y="372" font-size="12" font-family="Menlo, 'Courier New', monospace" font-weight="400" fill="#0f2a2e" >3fd2…</text><text x="496" y="408" font-size="12" font-family="Menlo, 'Courier New', monospace" font-weight="400" fill="#4b6266" >previous</text><text x="672" y="408" font-size="12" font-family="Menlo, 'Courier New', monospace" font-weight="400" fill="#0f2a2e" >9a07…</text><text x="496" y="436" font-size="12" font-family="Menlo, 'Courier New', monospace" font-weight="400" fill="#4b6266" >Files + manifest + signature</text><rect x="872" y="236" width="312" height="224" rx="6" fill="#e6efeb" stroke="#1e6b57" stroke-width="1.8"/><text x="896" y="272" font-size="16" font-family="Arial, Helvetica, sans-serif" font-weight="600" fill="#0f2a2e" >Next publication</text><text x="896" y="316" font-size="28" font-family="Georgia, 'Times New Roman', serif" font-weight="400" fill="#0f2a2e" >2027 / v1</text><path d="M896 340H1160" fill="none" stroke="#c9d8d4" stroke-width="1" stroke-linecap="butt"/><text x="896" y="372" font-size="12" font-family="Menlo, 'Courier New', monospace" font-weight="400" fill="#4b6266" >this hash</text><text x="1072" y="372" font-size="12" font-family="Menlo, 'Courier New', monospace" font-weight="400" fill="#0f2a2e" >8bc4…</text><text x="896" y="408" font-size="12" font-family="Menlo, 'Courier New', monospace" font-weight="400" fill="#4b6266" >previous</text><text x="1072" y="408" font-size="12" font-family="Menlo, 'Courier New', monospace" font-weight="400" fill="#0f2a2e" >3fd2…</text><text x="896" y="436" font-size="12" font-family="Menlo, 'Courier New', monospace" font-weight="400" fill="#4b6266" >Files + manifest + signature</text><text x="428" y="496" font-size="12" font-family="Menlo, 'Courier New', monospace" font-weight="400" fill="#4b6266" text-anchor="middle">refers back</text><text x="828" y="496" font-size="12" font-family="Menlo, 'Courier New', monospace" font-weight="400" fill="#4b6266" text-anchor="middle">refers back</text><path d="M72 544H1184" fill="none" stroke="#c9d8d4" stroke-width="1" stroke-linecap="butt"/><text x="72" y="584" font-size="28" font-family="Georgia, 'Times New Roman', serif" font-weight="400" fill="#0f2a2e" >Change the old bytes, and their hash changes.</text><text x="72" y="620" font-size="16" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#4b6266" >A retained later manifest exposes the mismatch with its recorded previous hash.</text><text x="72" y="656" font-size="16" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#4b6266" >Keep trusted copies: the chain alone does not detect replay of an older history.</text><text x="72" y="700" font-size="12" font-family="Menlo, 'Courier New', monospace" font-weight="400" fill="#4b6266" >Illustrative hashes, abbreviated for readability. Left to right is publication order, not elapsed time.</text></svg>
