<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-labelledby="hero-light-title hero-light-desc"><title id="hero-light-title">From a private record to a public disclosure</title><desc id="hero-light-desc">Private case records remain on the operator&#x27;s side while TransparencyKit produces a separate signed public report.</desc><rect x="0" y="0" width="960" height="640" rx="0" fill="#f5f7f6" stroke="none" /><path d="M480 112V528" fill="none" stroke="#c9d8d4" stroke-width="1" stroke-dasharray="4 8" stroke-linecap="butt"/><text x="104" y="100" font-size="12" font-family="Menlo, 'Courier New', monospace" font-weight="400" fill="#4b6266" letter-spacing="1.5">PRIVATE RECORD</text><text x="572" y="100" font-size="12" font-family="Menlo, 'Courier New', monospace" font-weight="400" fill="#4b6266" letter-spacing="1.5">PUBLIC DISCLOSURE</text><rect x="144" y="196" width="248" height="304" rx="2" fill="#f5f7f6" stroke="#4b6266" /><rect x="124" y="176" width="248" height="304" rx="2" fill="#f5f7f6" stroke="#4b6266" /><rect x="104" y="156" width="248" height="304" rx="2" fill="#f5f7f6" stroke="#4b6266" /><text x="128" y="196" font-size="12" font-family="Menlo, 'Courier New', monospace" font-weight="400" fill="#4b6266" >CASE RECORD</text><rect x="128" y="232" width="176" height="8" rx="0" fill="#0f2a2e" stroke="none" /><rect x="128" y="264" width="144" height="8" rx="0" fill="#0f2a2e" stroke="none" /><rect x="128" y="296" width="168" height="8" rx="0" fill="#0f2a2e" stroke="none" /><rect x="128" y="344" width="168" height="48" rx="2" fill="#e6efeb" stroke="#c9d8d4" /><text x="144" y="373" font-size="12" font-family="Menlo, 'Courier New', monospace" font-weight="400" fill="#4b6266" >private notes</text><path d="M352 288H480" fill="none" stroke="#1e6b57" stroke-width="4" stroke-linecap="butt"/><rect x="448" y="256" width="64" height="64" rx="0" fill="#f5f7f6" stroke="none" /><g transform="translate(448 256)"><path d="M9 9H51V23H45V15H15V49H45V41H51V55H9Z" fill="#0f2a2e"/><rect x="22" y="19" width="14" height="6" rx="0" fill="#0f2a2e" stroke="none" /><rect x="22" y="39" width="14" height="6" rx="0" fill="#0f2a2e" stroke="none" /><rect x="22" y="29" width="34" height="6" rx="0" fill="#1e6b57" stroke="none" /></g><path d="M512 288H572" fill="none" stroke="#1e6b57" stroke-width="4" stroke-linecap="butt"/><rect x="572" y="156" width="284" height="348" rx="2" fill="#ffffff" stroke="#4b6266" /><text x="596" y="196" font-size="12" font-family="Menlo, 'Courier New', monospace" font-weight="400" fill="#4b6266" >TRANSPARENCY REPORT</text><text x="596" y="256" font-size="28" font-family="Georgia, 'Times New Roman', serif" font-weight="400" fill="#0f2a2e" >A statement</text><text x="596" y="292" font-size="28" font-family="Georgia, 'Times New Roman', serif" font-weight="400" fill="#0f2a2e" >you can check.</text><rect x="596" y="324" width="228" height="4" rx="0" fill="#c9d8d4" stroke="none" /><rect x="596" y="348" width="184" height="4" rx="0" fill="#c9d8d4" stroke="none" /><rect x="596" y="372" width="208" height="4" rx="0" fill="#c9d8d4" stroke="none" /><path d="M596 408H832" fill="none" stroke="#c9d8d4" stroke-width="1" stroke-linecap="butt"/><text x="596" y="440" font-size="12" font-family="Menlo, 'Courier New', monospace" font-weight="400" fill="#1e6b57" >SHA-256 + Ed25519</text><text x="596" y="472" font-size="12" font-family="Menlo, 'Courier New', monospace" font-weight="400" fill="#4b6266" >signed public files</text><text x="104" y="568" font-size="28" font-family="Georgia, 'Times New Roman', serif" font-weight="400" fill="#0f2a2e" >The case stays private. The publication can be verified.</text></svg>
