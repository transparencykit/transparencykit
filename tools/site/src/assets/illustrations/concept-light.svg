<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="concept-light-title concept-light-desc"><title id="concept-light-title">Private records. Public proof.</title><desc id="concept-light-desc">The operator keeps case records private, publishes signed public projections, and readers verify file hashes and signatures using an independently trusted public key.</desc><defs><marker id="concept-light-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#4b6266"/></marker><marker id="concept-light-arrow-accent" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#1e6b57"/></marker><marker id="concept-light-arrow-link" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#4b6266"/></marker></defs><rect x="0" y="0" width="1280" height="720" rx="0" fill="#f5f7f6" stroke="none" /><text x="48" y="48" font-size="12" font-family="Menlo, 'Courier New', monospace" font-weight="400" fill="#4b6266" letter-spacing="1.5">01 / THE CONCEPT</text><text x="48" y="104" font-size="40" font-family="Georgia, 'Times New Roman', serif" font-weight="400" fill="#0f2a2e" >Private records. Public proof.</text><text x="48" y="140" font-size="16" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#4b6266" >Record the events. Publish selected information. Let anyone check the signed files.</text><rect x="48" y="188" width="680" height="320" rx="8" fill="#f5f7f6" stroke="#4b6266" stroke-dasharray="5 5"/><rect x="68" y="180" width="208" height="16" rx="0" fill="#f5f7f6" stroke="none" /><text x="76" y="192" font-size="12" font-family="Menlo, 'Courier New', monospace" font-weight="400" fill="#4b6266" letter-spacing="1">OPERATOR / PRIVATE</text><text x="792" y="192" font-size="12" font-family="Menlo, 'Courier New', monospace" font-weight="400" fill="#4b6266" letter-spacing="1">PUBLIC / READERS</text><path d="M344 328H444" fill="none" stroke="#4b6266" stroke-width="1.8" marker-end="url(#concept-light-arrow)" stroke-linecap="butt"/><path d="M684 328H788" fill="none" stroke="#1e6b57" stroke-width="1.8" marker-end="url(#concept-light-arrow-accent)" stroke-linecap="butt"/><path d="M1004 488V560" fill="none" stroke="#4b6266" stroke-width="1.8" marker-end="url(#concept-light-arrow)" stroke-linecap="butt"/><path d="M684 608H788" fill="none" stroke="#4b6266" stroke-width="1.8" marker-end="url(#concept-light-arrow)" stroke-dasharray="5 4" stroke-linecap="butt"/><rect x="80" y="236" width="264" height="224" rx="6" fill="#ffffff" stroke="#4b6266" /><text x="104" y="268" font-size="16" font-family="Arial, Helvetica, sans-serif" font-weight="600" fill="#0f2a2e" >Private ledger</text><rect x="104" y="288" width="216" height="36" rx="2" fill="#f5f7f6" stroke="#c9d8d4" /><text x="116" y="311" font-size="12" font-family="Menlo, 'Courier New', monospace" font-weight="400" fill="#4b6266" >01  record  9a07…</text><rect x="104" y="336" width="216" height="36" rx="2" fill="#f5f7f6" stroke="#c9d8d4" /><text x="116" y="359" font-size="12" font-family="Menlo, 'Courier New', monospace" font-weight="400" fill="#4b6266" >02  record  3fd2…</text><path d="M212 324V336" fill="none" stroke="#4b6266" stroke-width="1.5" stroke-linecap="butt"/><text x="104" y="412" font-size="16" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#4b6266" >Case references and notes</text><text x="104" y="436" font-size="16" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#4b6266" >stay inside the ledger.</text><rect x="444" y="256" width="240" height="168" rx="6" fill="#e6efeb" stroke="#1e6b57" stroke-width="1.8"/><g transform="translate(460 276) scale(.5)"><path d="M9 9H51V23H45V15H15V49H45V41H51V55H9Z" fill="#0f2a2e"/><rect x="22" y="19" width="14" height="6" rx="0" fill="#0f2a2e" stroke="none" /><rect x="22" y="39" width="14" height="6" rx="0" fill="#0f2a2e" stroke="none" /><rect x="22" y="29" width="34" height="6" rx="0" fill="#1e6b57" stroke="none" /></g><text x="504" y="300" font-size="16" font-family="Arial, Helvetica, sans-serif" font-weight="600" fill="#0f2a2e" >TransparencyKit</text><text x="468" y="340" font-size="16" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#0f2a2e" >Aggregate · render · sign</text><text x="468" y="372" font-size="12" font-family="Menlo, 'Courier New', monospace" font-weight="400" fill="#4b6266" >Only public projections</text><text x="468" y="396" font-size="12" font-family="Menlo, 'Courier New', monospace" font-weight="400" fill="#4b6266" >Signing key stays private</text><rect x="788" y="224" width="432" height="264" rx="6" fill="#ffffff" stroke="#4b6266" /><text x="812" y="260" font-size="16" font-family="Arial, Helvetica, sans-serif" font-weight="600" fill="#0f2a2e" >Signed publication</text><path d="M812 295H824" fill="none" stroke="#4b6266" stroke-width="2" stroke-linecap="butt"/><text x="836" y="300" font-size="16" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#0f2a2e" >Transparency report</text><path d="M812 323H824" fill="none" stroke="#4b6266" stroke-width="2" stroke-linecap="butt"/><text x="836" y="328" font-size="16" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#0f2a2e" >Data Act disclosure</text><path d="M812 351H824" fill="none" stroke="#4b6266" stroke-width="2" stroke-linecap="butt"/><text x="836" y="356" font-size="16" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#0f2a2e" >DSA CSVs</text><path d="M812 379H824" fill="none" stroke="#4b6266" stroke-width="2" stroke-linecap="butt"/><text x="836" y="384" font-size="16" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#0f2a2e" >Subprocessor list + feed</text><path d="M812 408H1196" fill="none" stroke="#c9d8d4" stroke-width="1" stroke-linecap="butt"/><text x="812" y="436" font-size="12" font-family="Menlo, 'Courier New', monospace" font-weight="400" fill="#4b6266" >manifest.json  +  manifest.sig</text><text x="812" y="460" font-size="12" font-family="Menlo, 'Courier New', monospace" font-weight="400" fill="#4b6266" >File hashes + Ed25519 signature</text><rect x="444" y="564" width="240" height="88" rx="6" fill="#f5f7f6" stroke="#4b6266" /><text x="468" y="596" font-size="16" font-family="Arial, Helvetica, sans-serif" font-weight="600" fill="#0f2a2e" >Trusted public key</text><text x="468" y="628" font-size="12" font-family="Menlo, 'Courier New', monospace" font-weight="400" fill="#4b6266" >Obtain independently</text><rect x="788" y="560" width="432" height="96" rx="6" fill="#f5f7f6" stroke="#4b6266" /><text x="812" y="592" font-size="16" font-family="Arial, Helvetica, sans-serif" font-weight="600" fill="#0f2a2e" >Anyone can verify</text><text x="812" y="624" font-size="16" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#4b6266" >Check the signature and each file hash.</text><text x="80" y="548" font-size="16" font-family="Georgia, 'Times New Roman', serif" font-weight="400" fill="#4b6266" font-style="italic">Publish the disclosure, keep the case file.</text><path d="M48 680H1232" fill="none" stroke="#c9d8d4" stroke-width="1" stroke-linecap="butt"/><text x="48" y="704" font-size="12" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#4b6266" >Report breakdowns may be banded. DSA CSVs remain exact. A signature does not prove that every event was recorded.</text></svg>
