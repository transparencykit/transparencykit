<svg xmlns="http://www.w3.org/2000/svg" width="384" height="1032" viewBox="0 0 384 1032" role="img" aria-labelledby="concept-compact-dark-title concept-compact-dark-desc"><title id="concept-compact-dark-title">Private records. Public proof.</title><desc id="concept-compact-dark-desc">Private case records stay with the operator while TransparencyKit publishes signed projections that readers verify with an independently trusted public key.</desc><defs><marker id="concept-compact-dark-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#9fb5b1"/></marker><marker id="concept-compact-dark-arrow-accent" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#5fc4a5"/></marker><marker id="concept-compact-dark-arrow-link" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#9fb5b1"/></marker></defs><rect x="0" y="0" width="384" height="1032" rx="0" fill="#0d1f22" stroke="none" /><text x="24" y="36" font-size="12" font-family="Menlo, 'Courier New', monospace" font-weight="400" fill="#9fb5b1" letter-spacing="1">HOW IT WORKS</text><text x="24" y="80" font-size="28" font-family="Georgia, 'Times New Roman', serif" font-weight="400" fill="#e4eeeb" >Private records.</text><text x="24" y="116" font-size="28" font-family="Georgia, 'Times New Roman', serif" font-weight="400" fill="#e4eeeb" >Public proof.</text><rect x="16" y="160" width="352" height="352" rx="8" fill="#0d1f22" stroke="#9fb5b1" stroke-dasharray="5 5"/><rect x="28" y="152" width="192" height="16" rx="0" fill="#0d1f22" stroke="none" /><text x="32" y="164" font-size="12" font-family="Menlo, 'Courier New', monospace" font-weight="400" fill="#9fb5b1" >OPERATOR / PRIVATE</text><path d="M192 304V352" fill="none" stroke="#9fb5b1" stroke-width="1.8" marker-end="url(#concept-compact-dark-arrow)" stroke-linecap="butt"/><path d="M192 480V576" fill="none" stroke="#5fc4a5" stroke-width="1.8" marker-end="url(#concept-compact-dark-arrow-accent)" stroke-linecap="butt"/><path d="M192 784V832" fill="none" stroke="#9fb5b1" stroke-width="1.8" marker-end="url(#concept-compact-dark-arrow)" stroke-linecap="butt"/><rect x="32" y="192" width="320" height="112" rx="6" fill="#12292d" stroke="#9fb5b1" /><text x="56" y="224" font-size="18" font-family="Arial, Helvetica, sans-serif" font-weight="600" fill="#e4eeeb" >Private ledger</text><text x="56" y="256" font-size="14" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#9fb5b1" >Case references and notes</text><text x="56" y="280" font-size="14" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#9fb5b1" >stay in the private ledger.</text><rect x="32" y="352" width="320" height="128" rx="6" fill="#16343a" stroke="#5fc4a5" stroke-width="1.8"/><g transform="translate(48 368) scale(.5)"><path d="M9 9H51V23H45V15H15V49H45V41H51V55H9Z" fill="#e4eeeb"/><rect x="22" y="19" width="14" height="6" rx="0" fill="#e4eeeb" stroke="none" /><rect x="22" y="39" width="14" height="6" rx="0" fill="#e4eeeb" stroke="none" /><rect x="22" y="29" width="34" height="6" rx="0" fill="#5fc4a5" stroke="none" /></g><text x="92" y="392" font-size="18" font-family="Arial, Helvetica, sans-serif" font-weight="600" fill="#e4eeeb" >TransparencyKit</text><text x="56" y="424" font-size="16" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#e4eeeb" >Aggregate · render · sign</text><text x="56" y="452" font-size="14" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#9fb5b1" >Signing key stays private</text><text x="32" y="552" font-size="12" font-family="Menlo, 'Courier New', monospace" font-weight="400" fill="#9fb5b1" >PUBLIC / READERS</text><rect x="32" y="576" width="320" height="208" rx="6" fill="#12292d" stroke="#9fb5b1" /><text x="56" y="608" font-size="18" font-family="Arial, Helvetica, sans-serif" font-weight="600" fill="#e4eeeb" >Signed publication</text><text x="56" y="640" font-size="16" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#e4eeeb" >Transparency report</text><text x="56" y="664" font-size="16" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#e4eeeb" >Data Act disclosure</text><text x="56" y="688" font-size="16" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#e4eeeb" >DSA CSVs</text><text x="56" y="712" font-size="16" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#e4eeeb" >Subprocessor list + feed</text><path d="M56 732H328" fill="none" stroke="#395559" stroke-width="1" stroke-linecap="butt"/><text x="56" y="760" font-size="14" font-family="Menlo, 'Courier New', monospace" font-weight="400" fill="#9fb5b1" >File hashes + signature</text><rect x="32" y="832" width="320" height="120" rx="6" fill="#0d1f22" stroke="#9fb5b1" /><text x="56" y="864" font-size="18" font-family="Arial, Helvetica, sans-serif" font-weight="600" fill="#e4eeeb" >Anyone can verify</text><text x="56" y="896" font-size="14" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#9fb5b1" >Check files with a public key</text><text x="56" y="920" font-size="14" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#9fb5b1" >obtained independently.</text><text x="24" y="988" font-size="12" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#9fb5b1" >DSA CSVs are exact. Private fields stay private.</text><text x="24" y="1012" font-size="12" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#9fb5b1" >A signature does not prove completeness.</text></svg>
